services:
  postgres:
    image: postgres:16-alpine
    container_name: transaction-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: txn_app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: transaction_engine_dev
    ports:
      - "5432:5432"
    volumes:
      - transaction_engine_pgdata:/var/lib/postgresql/data
      - ./src/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txn_app -d transaction_engine_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transaction_engine_pgdata:
